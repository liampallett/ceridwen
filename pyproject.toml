[project]
name = "ceridwen-v2"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ceridwen"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]
